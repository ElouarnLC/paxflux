<!DOCTYPE html>
<html lang="fr" class="dark h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No `maximum-scale` and no `user-scalable=no`: an operator reading a
      gauge in bad light must be able to pinch-zoom, and WCAG 1.4.4 expects
      at least 5× (SC 1.4.4). `viewport-fit=cover` lets the app paint into
      the display cutout area, which is only safe because the counter
      applies real `env(safe-area-inset-*)` padding (see styles/index.css).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="PaxFlux — Self-hosted realtime crowd flow & occupancy management" />
    <title>PaxFlux</title>
  </head>
  <!--
    `select-none` belongs on the counter's tap surfaces, not on the
    document: applied here it also made every pairing URL, checksum and
    event name in the admin interface impossible to copy. `overflow-x-hidden`
    is gone for the same class of reason — it clipped horizontal overflow
    out of sight instead of preventing it.
  -->
  <body class="h-full antialiased font-sans">
    <div id="root" class="min-h-dvh flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
